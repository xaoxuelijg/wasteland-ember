<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>废土牌局：余烬 · v2.0</title>
<style>
:root{
  --bg:#2B2620; --panel:#4A443C; --ember:#E67E22; --gold:#F1C40F;
  --red:#C0392B; --red2:#E74C3C; --green:#27AE60; --green2:#2ECC71;
  --blue:#2471A3; --blue2:#5DADE2; --bone:#E8E0D5; --ash:#8A8378;
}
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--bone);font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
#app{height:100vh;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;min-height:0}
.screen.on{display:flex}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.serif{font-family:Georgia,"KaiTi","STKaiti",serif}

/* ===== 通用 ===== */
.btn{
  padding:10px 34px;font-size:17px;letter-spacing:6px;color:var(--ember);font-weight:700;
  background:linear-gradient(180deg,#3a352e,#2B2620);border:2px solid var(--ember);border-radius:6px;
  box-shadow:0 0 0 1px #1a1712,inset 0 1px 0 rgba(230,126,34,.25);transition:all .15s;
}
.btn:hover:not(:disabled){box-shadow:0 0 14px rgba(230,126,34,.55),inset 0 1px 0 rgba(230,126,34,.25);transform:translateY(-2px)}
.btn:active:not(:disabled){transform:translateY(1px);filter:brightness(.85)}
.btn:disabled{color:var(--ash);border-color:var(--ash);cursor:not-allowed;opacity:.55}
.bar{height:14px;background:#1c1915;border:1px solid #171410;border-radius:7px;overflow:hidden;position:relative}
.bar .fill{height:100%;transition:width .35s;border-radius:6px}
.bar .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000}
.fill.hp-p{background:linear-gradient(180deg,var(--green2),var(--green))}
.fill.hp-e{background:linear-gradient(180deg,var(--ember),#b3600f)}
.fill.low{animation:lowhp .7s infinite alternate}
@keyframes lowhp{from{background:#a02622}to{background:var(--red2)}}

/* ===== 主菜单（两级） ===== */
#screen-menu{position:relative;align-items:center;justify-content:center;justify-content:safe center;gap:26px;padding:20px;overflow-y:auto;overscroll-behavior:contain}
#screen-setup{position:relative;align-items:center;justify-content:center;justify-content:safe center;gap:16px;padding:20px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#screen-setup>*{flex-shrink:0}
.bg-img{position:absolute;inset:0;background-size:cover;background-position:center;z-index:-2}
.bg-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(43,38,32,.55),rgba(43,38,32,.82))}
#menu-title{font-size:52px;letter-spacing:14px;color:var(--ember);text-shadow:0 0 24px rgba(230,126,34,.6),0 3px 0 #1a1712;font-weight:900;text-align:center}
#menu-title span{display:block;font-size:15px;letter-spacing:8px;color:var(--ash);text-align:center;margin-top:8px}
.menu-btns{display:flex;flex-direction:column;gap:16px;margin-top:6px;align-items:center;z-index:1}
.btn.menu-main{font-size:22px;padding:14px 62px;letter-spacing:12px;animation:glowPulse 2s infinite alternate}
@keyframes glowPulse{from{box-shadow:0 0 8px rgba(230,126,34,.3)}to{box-shadow:0 0 26px rgba(230,126,34,.8)}}
.btn.menu-sub{font-size:15px;padding:9px 40px;letter-spacing:8px;color:var(--bone);border-color:#5d564a}
.btn.menu-sub:hover{color:var(--ember);border-color:var(--ember)}
.menu-hint{color:var(--ash);font-size:12px;letter-spacing:2px}
.pick-label{color:var(--ash);letter-spacing:4px;font-size:13px;z-index:1}
.pick-row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;z-index:1}
.pick-card{
  width:168px;padding:14px 12px;border-radius:8px;background:rgba(74,68,60,.88);border:2px solid #5d564a;
  display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .16s;position:relative;cursor:pointer;
}
.pick-card img{width:100%;height:120px;object-fit:cover;object-position:top;border-radius:5px;border:1px solid #2a252f}
.pick-card .pc-name{font-size:17px;font-weight:700;letter-spacing:2px}
.pick-card .pc-desc{font-size:11px;color:var(--ash);text-align:center;line-height:1.5;min-height:32px}
.pick-card:hover{transform:translateY(-4px)}
.pick-card.sel{border-color:var(--ember);transform:translateY(-6px);box-shadow:0 0 18px rgba(230,126,34,.5)}
.pick-card.locked{filter:grayscale(1) brightness(.5);cursor:not-allowed}
.pick-card.locked::after{content:"🔒 通关上一难度解锁";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--bone);background:rgba(20,17,13,.55);border-radius:8px;text-align:center;padding:10px}
#btn-start{margin-top:4px;z-index:1}
#setup-back{margin-top:2px}

/* ===== 战斗 ===== */
#screen-battle{position:relative}
#battle-bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:-2;transition:background-image .5s}
#battle-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(43,38,32,.72),rgba(43,38,32,.55) 45%,rgba(30,26,21,.9))}
#topbar{display:flex;align-items:center;gap:14px;padding:7px 16px;background:rgba(28,24,19,.9);border-bottom:1px solid #171410;font-size:13px}
#topbar .tb-item{color:var(--ash)}
#topbar .tb-item b{color:var(--bone)}
#diff-chip{color:var(--ember);border:1px solid var(--ember);border-radius:4px;padding:1px 8px;font-size:12px}
#buff-bar{display:flex;gap:5px;flex:1}
#buff-bar span{font-size:16px;filter:drop-shadow(0 0 3px rgba(230,126,34,.6))}
.tb-right{display:flex;gap:8px;align-items:center}
.mini-btn{padding:6px 14px;font-size:12px;color:var(--ash);border:1px solid #5d564a;border-radius:5px;background:rgba(43,38,32,.8)}
.mini-btn:hover{color:var(--ember);border-color:var(--ember)}

#enemy-band{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 12px 2px}
#enemy-name{font-size:18px;font-weight:800;letter-spacing:3px;color:var(--bone)}
#enemy-name .phase-tag{font-size:11px;color:var(--ember);border:1px solid var(--ember);border-radius:4px;padding:1px 7px;margin-left:8px;letter-spacing:1px;vertical-align:2px}
#enemy-tags{display:flex;gap:8px;min-height:22px;align-items:center;flex-wrap:wrap;justify-content:center}
.weak-chip{font-size:11px;font-weight:700;padding:2px 10px;border-radius:10px;border:1px dashed}
.weak-chip.fire{color:#ffb26b;border-color:var(--ember);background:rgba(230,126,34,.12)}
.weak-chip.elec{color:#9cc8ec;border-color:var(--blue);background:rgba(36,113,163,.12)}
.weak-chip.phys{color:#e8e0d5;border-color:#8A8378;background:rgba(138,131,120,.12)}
.weak-chip.poison{color:#7fe0a8;border-color:var(--green);background:rgba(39,174,96,.12)}
.trait-chip{font-size:11px;padding:2px 10px;border-radius:4px;color:var(--gold);border:1px solid rgba(241,196,15,.5);background:rgba(241,196,15,.08)}
#enemy-hp-wrap{display:flex;align-items:center;gap:10px;width:min(520px,60vw)}
#enemy-hp-wrap .bar{flex:1}
.blk-badge{min-width:30px;height:30px;border-radius:6px;background:var(--blue);display:none;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;border:2px solid var(--blue2);box-shadow:0 0 8px rgba(36,113,163,.8)}
.blk-badge.on{display:flex}
#intent-row{display:flex;gap:8px;min-height:26px;flex-wrap:wrap;justify-content:center}
.intent-chip{padding:3px 12px;border-radius:12px;font-size:13px;font-weight:700;background:rgba(28,24,19,.85);border:1px solid #5d564a}
.intent-chip.atk{color:#ff8a75;border-color:var(--red)}
.intent-chip.def{color:#8ec3e8;border-color:var(--blue)}
.intent-chip.buf{color:#7fe0a8;border-color:var(--green)}
.intent-chip.sum{color:#ffd97a;border-color:var(--gold)}
.intent-chip.chg{color:#c9a0ff;border-color:#8e44ad;animation:pulse 1s infinite alternate}
@keyframes pulse{from{box-shadow:0 0 2px rgba(142,68,173,.4)}to{box-shadow:0 0 14px rgba(142,68,173,.9)}}
.status-row{display:flex;gap:6px;min-height:22px;flex-wrap:wrap;justify-content:center}
.st{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:700}
.st.vuln{background:rgba(192,57,43,.3);color:#ff9d8a;border:1px solid var(--red)}
.st.weak{background:rgba(138,131,120,.3);color:#c9c2b6;border:1px solid var(--ash)}
.st.burn{background:rgba(230,126,34,.25);color:#ffb26b;border:1px solid var(--ember)}
.st.elec{background:rgba(36,113,163,.25);color:#9cc8ec;border:1px solid var(--blue)}
.st.poison{background:rgba(39,174,96,.2);color:#7fe0a8;border:1px solid var(--green)}
.st.str{background:rgba(241,196,15,.18);color:var(--gold);border:1px solid var(--gold)}
.st.con{background:rgba(36,113,163,.25);color:#9cc8ec;border:1px solid var(--blue)}
.st.sum{background:rgba(241,196,15,.15);color:var(--gold);border:1px solid rgba(241,196,15,.5)}

#mid-row{flex:1;display:flex;gap:14px;padding:6px 18px;min-height:0;position:relative}
.portrait{
  width:196px;border-radius:10px;position:relative;overflow:hidden;flex-shrink:0;align-self:stretch;
  border:3px solid #5d564a;background:#1c1915;filter:brightness(.6);transition:filter .25s,transform .25s,box-shadow .25s;
}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transform:scale(1.09);transform-origin:center top}
.portrait.active{filter:brightness(1.02);transform:translateY(-8px)}
.portrait.active.glow-red{box-shadow:0 0 26px rgba(231,76,60,.8);border-color:var(--red2)}
.portrait.active.glow-green{box-shadow:0 0 26px rgba(46,204,113,.8);border-color:var(--green2)}
.portrait.active.glow-blue{box-shadow:0 0 26px rgba(93,173,226,.8);border-color:var(--blue2)}
.portrait.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.portrait.lunge{animation:lunge .38s}
@keyframes lunge{30%{transform:translateX(-16px) scale(1.03)}100%{transform:translateX(0)}}
.portrait.burning::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(circle at 50% 78%,rgba(230,126,34,.6),rgba(190,70,10,.28) 55%,transparent 75%);
  mix-blend-mode:screen;animation:burnflick .5s infinite alternate}
.portrait.poisoned::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(circle at 50% 70%,rgba(39,174,96,.55),rgba(20,90,50,.25) 58%,transparent 76%);
  mix-blend-mode:screen;animation:burnflick .7s infinite alternate}
@keyframes burnflick{from{opacity:.55}to{opacity:1}}
.p-info{position:absolute;left:0;right:0;bottom:0;padding:8px;background:linear-gradient(0deg,rgba(20,17,13,.94),transparent);display:flex;flex-direction:column;gap:5px;z-index:2}
.p-name{font-size:13px;font-weight:800;letter-spacing:2px;text-shadow:0 1px 2px #000}
.p-hp-row{display:flex;align-items:center;gap:6px}
.p-hp-row .bar{flex:1}
.p-status{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;z-index:2}
.p-blk{position:absolute;top:8px;right:8px;z-index:2}

#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-width:0}
#stage-cards{display:flex;gap:10px;align-items:center;justify-content:center;z-index:5}
#stage-intent{
  position:absolute;top:34%;left:50%;transform:translateX(-50%) scale(0);font-size:15px;font-weight:800;letter-spacing:3px;
  padding:10px 26px;border-radius:10px;background:rgba(28,24,19,.92);border:2px solid var(--ember);color:var(--bone);z-index:6;white-space:nowrap;
}
#stage-intent.pop{animation:ipop 1.5s ease forwards}
@keyframes ipop{0%{transform:translateX(-50%) scale(.3);opacity:0}18%{transform:translateX(-50%) scale(1.12);opacity:1}30%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1)}}
#log{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:12px;color:var(--ash);letter-spacing:1px}
#banner{position:absolute;top:38%;left:50%;transform:translateX(-50%);font-size:30px;font-weight:900;letter-spacing:8px;color:var(--ember);text-shadow:0 0 18px rgba(230,126,34,.8);opacity:0;pointer-events:none;z-index:20;white-space:nowrap}
#banner.show{animation:bshow 1.6s ease forwards}
@keyframes bshow{0%{opacity:0;transform:translateX(-50%) scale(.7)}20%{opacity:1;transform:translateX(-50%) scale(1)}75%{opacity:1}100%{opacity:0}}

#float-layer{position:absolute;inset:0;pointer-events:none;z-index:15;overflow:visible}
.float-num{position:absolute;font-size:30px;font-weight:900;transform:translate(-50%,-50%);animation:rise .85s ease-out forwards;text-shadow:0 2px 3px #000;white-space:nowrap}
.float-num.dmg{color:#fff;-webkit-text-stroke:1.5px var(--red);text-shadow:0 0 10px rgba(231,76,60,.9)}
.float-num.heal{color:#fff;-webkit-text-stroke:1.5px var(--green);text-shadow:0 0 10px rgba(46,204,113,.9)}
.float-num.blk{color:#fff;-webkit-text-stroke:1.5px var(--blue);font-size:22px;text-shadow:0 0 10px rgba(93,173,226,.9)}
.float-num.info{color:var(--gold);font-size:18px;-webkit-text-stroke:0}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}25%{opacity:1;transform:translate(-50%,-60%) scale(1.25)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
.vfx{position:absolute;transform:translate(-50%,-50%);width:170px;height:170px;mix-blend-mode:screen;animation:vfxp .55s ease-out forwards}
@keyframes vfxp{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}35%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.35)}}
.pt{position:absolute;width:5px;height:5px;border-radius:50%;pointer-events:none;z-index:14;animation:ptUp 1.1s ease-out forwards}
@keyframes ptUp{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--dx,0px),-70px) scale(.3)}}

/* 卡牌 */
.card{
  width:112px;height:154px;border-radius:8px;background:#241f19;position:relative;flex-shrink:0;
  border:3px solid;cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;overflow:hidden;
}
.card.atk{border-color:var(--red);box-shadow:inset 0 0 12px rgba(231,76,60,.35)}
.card.buf{border-color:var(--green);box-shadow:inset 0 0 12px rgba(46,204,113,.3)}
.card.def{border-color:var(--blue);box-shadow:inset 0 0 12px rgba(93,173,226,.3)}
.card .c-art{width:100%;height:78px;object-fit:cover;display:block;border-bottom:1px solid #171410}
.card .c-cost{
  position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;z-index:2;
  background:radial-gradient(circle at 35% 30%,#6d6558,#3a352e);border:2px solid var(--gold);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;color:var(--gold);
}
.card .c-cost.cheap{color:var(--green2);border-color:var(--green2)}
.card .c-rar{position:absolute;top:6px;right:6px;width:10px;height:10px;transform:rotate(45deg);z-index:2;border:1px solid #0008}
.card .c-rar.n{background:var(--ash)} .card .c-rar.r{background:var(--blue2)} .card .c-rar.e{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.card .c-name{font-size:12px;font-weight:800;text-align:center;padding:3px 2px 1px;background:rgba(43,38,32,.9);letter-spacing:1px;white-space:nowrap;overflow:hidden}
.card .c-type{font-size:9px;text-align:center;color:var(--ash)}
.card .c-text{font-size:10px;line-height:1.35;text-align:center;padding:2px 5px;color:var(--bone);flex:1;display:flex;align-items:center;justify-content:center}
#hand-row .card:hover{transform:translateY(-16px) scale(1.08);z-index:5}
#hand-row .card.atk:hover{box-shadow:0 0 18px rgba(231,76,60,.75)}
#hand-row .card.buf:hover{box-shadow:0 0 18px rgba(46,204,113,.75)}
#hand-row .card.def:hover{box-shadow:0 0 18px rgba(93,173,226,.75)}
.card.cant{filter:grayscale(.7) brightness(.55)}
.card.cant:hover{transform:none;box-shadow:none}
.card.fused{border-color:var(--gold)!important;box-shadow:0 0 10px rgba(241,196,15,.5),inset 0 0 12px rgba(241,196,15,.25)}
.card .fuse-tag{position:absolute;top:3px;right:3px;z-index:3;font-size:9px;font-weight:900;color:#1a1712;background:var(--gold);border-radius:3px;padding:1px 4px}
.card.fuseable{outline:2px dashed var(--gold);outline-offset:1px}
.fuse-btn{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);z-index:4;font-size:10px;font-weight:900;color:#1a1712;background:var(--gold);border:none;border-radius:8px;padding:2px 8px;cursor:pointer;box-shadow:0 0 8px rgba(241,196,15,.8)}
.fuse-btn:hover{filter:brightness(1.2)}
.card.stage-card{width:148px;height:204px;animation:flyin .34s ease-out}
.card.stage-card .c-art{height:112px}
.card.stage-card .c-name{font-size:14px}
.card.stage-card .c-text{font-size:11px}
.card.stage-card.atk{box-shadow:0 0 24px rgba(231,76,60,.8)}
.card.stage-card.buf{box-shadow:0 0 24px rgba(46,204,113,.8)}
.card.stage-card.def{box-shadow:0 0 24px rgba(93,173,226,.8)}
.card.to-discard{animation:todis .34s ease-in forwards}
@keyframes flyin{from{transform:translateY(140px) scale(.55);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
@keyframes todis{to{transform:translate(120px,160px) scale(.3);opacity:0}}

#table-strip{height:14px;margin:0 40px;background:linear-gradient(180deg,#57503f,#332d24);border:1px solid #171410;border-radius:50%/100% 100% 0 0;opacity:.8}
#player-band{display:flex;align-items:center;gap:16px;padding:6px 20px}
#energy-pips{display:flex;gap:6px;align-items:center}
.pip{width:18px;height:26px;clip-path:polygon(50% 0,100% 25%,100% 100%,0 100%,0 25%);background:#3a352e;border:1px solid #171410;transition:all .2s}
.pip.on{background:linear-gradient(180deg,var(--gold),#b98a0a);box-shadow:0 0 8px rgba(241,196,15,.7)}
#energy-label{font-size:12px;color:var(--ash)}
#btn-end{margin-left:auto}
#hand-row{display:flex;gap:10px;justify-content:center;align-items:flex-end;padding:2px 16px 8px;min-height:166px}
#bottombar{display:flex;justify-content:space-between;padding:5px 20px;font-size:12px;color:var(--ash);background:rgba(28,24,19,.9);border-top:1px solid #171410}

/* ===== 覆盖层 ===== */
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;gap:22px}
.overlay.on{display:flex}
.overlay .bg-img{position:absolute}
.ov-panel{position:relative;background:rgba(35,30,24,.92);border:2px solid #5d564a;border-radius:12px;padding:30px 40px;display:flex;flex-direction:column;align-items:center;gap:16px;max-width:880px;box-shadow:0 0 40px #000;animation:ovpop .3s ease-out;max-height:92vh;overflow-y:auto}
@keyframes ovpop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.ov-title{font-size:28px;letter-spacing:10px;font-weight:900;color:var(--ember);text-align:center}
.ov-sub{color:var(--ash);letter-spacing:2px;font-size:13px}
.draft-row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.draft-card{
  width:180px;padding:18px 14px;border-radius:10px;background:rgba(74,68,60,.9);border:2px solid #5d564a;
  display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:all .15s;text-align:center;
}
.draft-card .d-icon{font-size:38px}
.draft-card .d-name{font-size:16px;font-weight:800;letter-spacing:2px}
.draft-card .d-desc{font-size:12px;color:var(--bone);line-height:1.6}
.draft-card .d-cat{font-size:10px;color:var(--ash);border:1px solid #5d564a;border-radius:3px;padding:1px 6px}
.draft-card:hover{transform:translateY(-6px)}
.draft-card.sel{border-color:var(--gold);transform:translateY(-6px);box-shadow:0 0 18px rgba(241,196,15,.55)}
#victory-rank{font-size:74px;font-weight:900;color:var(--gold);text-shadow:0 0 30px rgba(241,196,15,.8);line-height:1}
.result-stats{display:flex;gap:26px;font-size:14px;color:var(--bone)}
.result-stats b{color:var(--gold)}
.result-buffs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:13px}

.ov-btns{display:flex;gap:16px}

#codex-panel td,#codex-panel th{border:1px solid #5d564a;padding:4px 10px;color:var(--bone)}

.codex-grid{display:grid;grid-template-columns:repeat(auto-fill,112px);gap:12px;justify-content:center}
.codex-grid .card{cursor:default}
.codex-chars{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.codex-chars figure{width:120px;text-align:center;font-size:12px;color:var(--ash)}
.codex-chars img{width:120px;height:160px;object-fit:cover;object-position:top;border-radius:8px;border:2px solid #5d564a}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#5d564a;border-radius:4px}::-webkit-scrollbar-track{background:#2B2620}

/* v3 Seed RNG：mulberry32（可复现随机）。逻辑层随机一律走 G.rng；
   表现层随机（粒子等）保留 Math.random，不进 seed（12 号方案规则 11） */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function centerOf(sel){
  const r=$(sel).getBoundingClientRect(),l=$("#float-layer").getBoundingClientRect();

}
function floatOn(sel,text,cls){
  if(cls&&cls!=="info"&&!G.opts.nums)return;

  el.className="float-num "+cls;el.textContent=text;
  el.style.left=p.x+"px";el.style.top=p.y+"px";
  $("#float-layer").appendChild(el);setTimeout(()=>el.remove(),900);
}
function vfxOn(sel,src){

function spawnParticles(sel,color,count=24){
  const t=$(sel);if(!t)return;
  for(let i=0;i<count;i++){
    const p=document.createElement("div");p.className="pt";
    p.style.background=color;p.style.boxShadow="0 0 6px "+color;
    p.style.left=(8+Math.random()*84)+"%";p.style.top=(38+Math.random()*52)+"%";
    p.style.setProperty("--dx",(Math.random()*60-30)+"px");
    p.style.animationDuration=(0.7+Math.random()*0.6)+"s";
    t.appendChild(p);setTimeout(()=>p.remove(),1500);
  }
}

function cardEl(inst,stage){

  el.className="card "+c.type+(stage?" stage-card":"")+(c.fused?" fused":"");
  const cost=stage?c.cost:effCost(inst);

}
function effCost(inst){
  const c=CARDS[inst.id];
  let cost=inst.tempCost!=null?inst.tempCost:c.cost;
  if(c.type==="atk"){
    if(G.runMods&&G.runMods.atkDisc)cost-=G.runMods.atkDisc;
    if(has("light")&&G.tf&&!G.tf.atkPlayed)cost--;
    if(P.costDownNext>0)cost--;
  }
  if(c.sum&&P.summonDisc>0)cost--;
  return Math.max(0,cost);
}

/* ================= 战斗效果 ================= */
function calcPlayerDmg(base){
  let d=base+P.str+(has("ammo")?1:0)+((has("laststand")&&P.hp<=P.maxhp*0.3)?3:0);
  if(G.cls==="ranger"&&E.hp<=E.maxhp*0.3)d=Math.floor(d*1.5);
  if(P.status.weak>0)d=Math.floor(d*0.75);
  if(E.status.vuln>0)d=Math.floor(d*1.5);
  if(has("weakspot")&&E.status.vuln>0)d=Math.floor(d*1.3);
  return Math.max(0,d);
}
async function hit(base,opts={}){
  if(G.over||!E||E.hp<=0)return;
  let d=calcPlayerDmg(base);
  let mult=1,combo=null,flat=0;
  const tag=opts.tag;
  const preElec=E.status.elec; // 命中前就已存在的感电（避免 R2 转感电被重复结算）
  if(tag==="phys"&&E.status.burn){
    combo="爆燃！×2";mult*=2;
    const b=E.status.burn,det=b.dmg*b.turns;E.status.burn=null;
    E.hp=Math.max(0,E.hp-det);
    vfxOn("#portrait-enemy",ART.vfxFire);
    floatOn("#portrait-enemy","爆燃结算 -"+det,"dmg");
    spawnParticles("#portrait-enemy","#ff8c42",30);
  }else if(tag==="elec"&&E.status.burn){
    combo="过载！×1.5";mult*=1.5;
    const b=E.status.burn;
    E.status.elec=Math.max(E.status.elec||0,b.turns);E.status.burn=null;
    vfxOn("#portrait-enemy",ART.vfxElec);
    spawnParticles("#portrait-enemy","#7db8e8",24);
  }else if(tag==="fire"&&E.status.elec>0){
    combo="电弧助燃！×1.5";mult*=1.5;
    vfxOn("#portrait-enemy",ART.vfxElec);
    spawnParticles("#portrait-enemy","#7db8e8",24);
  }else if(tag==="fire"&&E.status.poison){
    combo="毒雾爆！+5";flat+=5;
    vfxOn("#portrait-enemy",ART.vfxPoison);
    spawnParticles("#portrait-enemy","#62d98a",24);
  }
  if(preElec>0&&E.status.elec>0){mult*=1.5;E.status.elec=0;vfxOn("#portrait-enemy",ART.vfxElec);}
  if(E.weak&&tag&&tag===E.weak){mult*=1.5;if(G.stats)G.stats.weak++;floatOn("#portrait-enemy","弱点克制！","info");}
  mult=Math.min(mult,3);
  d=Math.floor(d*mult)+flat;
  const absorbed=opts.pierce?0:Math.min(E.block,d);
  E.block-=absorbed;
  const loss=Math.max(0,d-absorbed);
  E.hp=Math.max(0,E.hp-loss);
  if(combo){if(G.stats)G.stats.link++;floatOn("#portrait-enemy",combo,"info");}
  vfxOn("#portrait-enemy",ART.vfxHit);
  floatOn("#portrait-enemy","-"+loss,"dmg");
  if(tag==="fire")spawnParticles("#portrait-enemy","#ff8c42",18);
  else if(tag==="elec")spawnParticles("#portrait-enemy","#7db8e8",18);
  else if(tag==="poison")spawnParticles("#portrait-enemy","#62d98a",18);
  if(absorbed>0)vfxOn("#portrait-enemy",ART.vfxBlock);
  const pe=$("#portrait-enemy");pe.classList.remove("shake");void pe.offsetWidth;pe.classList.add("shake");
  if(has("bloodlust")&&!G.tf.atkHit&&loss>0){G.tf.atkHit=true;await healPlayer(2,false);}
  checkPhase();
  render();
  await sleep(300);
}
async function healPlayer(n,fromCard){
  if(fromCard){
    if(has("recipe"))n+=3;
    if(G.cls==="medic"&&!G.tf.healed){n+=3;log("急救充能：治疗 +3");}
    G.tf.healed=true;
  }
  const real=Math.min(n,P.maxhp-P.hp);
  P.hp+=real;
  vfxOn("#portrait-player",ART.vfxHeal);
  floatOn("#portrait-player","+"+real,"heal");
  render();
  await sleep(240);
}

function burnEnemy(turns){

async function damagePlayer(base){
  if(G.over)return;
  let d=base+E.str;
  if(E.status.weak>0)d=Math.floor(d*0.75);
  if(P.status.vuln>0)d=Math.floor(d*1.5);
  d=Math.max(0,d);
  const absorbed=Math.min(P.block,d);
  P.block-=absorbed;
  let loss=d-absorbed;
  const bear=P.summons.find(s=>s.taunt&&s.hp>0);
  if(bear&&loss>0){
    const toBear=Math.max(1,Math.floor(loss/2));
    bear.hp=Math.max(0,bear.hp-toBear);
    P.summons=P.summons.filter(s=>s.hp>0);
    loss-=toBear;
    floatOn("#portrait-player","🐻替挡 -"+toBear,"blk");
  }
  P.hp=Math.max(0,P.hp-loss);
  if(G.stats)G.stats.dmgTakenTotal=(G.stats.dmgTakenTotal||0)+loss;
  vfxOn("#portrait-player",ART.vfxHit);
  floatOn("#portrait-player","-"+loss,"dmg");
  if(absorbed>0)vfxOn("#portrait-player",ART.vfxBlock);
  const pp=$("#portrait-player");pp.classList.remove("shake");void pp.offsetWidth;pp.classList.add("shake");
  if(has("secondwind")&&!G.bf.secondwind&&P.hp>0&&P.hp<15){
    G.bf.secondwind=true;log("战斗续行触发！");await healPlayer(10,false);
  }
  render();
  await sleep(280);
}

async function execIntent(it){

/* ================= 回合流程 ================= */
async function playerTurn(){
  if(G.over)return;
  G.turn++;G.totalTurns++;
  P.block=has("armorkeep")?Math.floor(P.block/2):0;
  G.tf={atkPlayed:false,healed:false,blockGained:false,atkHit:false,fused:false,mechFuseBonus:false,rangerProc:false,played:0,rew:false};
  P.hand.forEach(i=>i.tempCost=null);
  if(P.pendingWeak>0){P.status.weak=Math.max(P.status.weak,P.pendingWeak);P.pendingWeak=0;floatOn("#portrait-player","烈酒反噬·虚弱","info");}
  if(E.key==="victor"&&E.phase===3){
    P.hp=Math.max(0,P.hp-3);
    floatOn("#portrait-player","-3 灼烧","dmg");
    if(P.hp<=0){await defeat();return;}
  }
  /* 召唤物行动 */
  for(const s of [...P.summons]){
    if(E.hp<=0)break;
    const d=s.dmg*(P.summonAtkBuff||1);
    E.hp=Math.max(0,E.hp-d);
    floatOn("#portrait-enemy","-"+d+" "+s.icon,"dmg");
    if(G.cls==="summoner")gainBlock(1);
    spawnParticles("#portrait-enemy","#F1C40F",10);
    checkPhase();
    await sleep(160);
  }
  P.summons=P.summons.filter(s=>s.hp>0);
  if(E.hp<=0){await winBattle();return;}
  /* 机械造物行动 */
  for(const c of P.constructs){
    if(c.kind==="drone"){E.hp=Math.max(0,E.hp-2);floatOn("#portrait-enemy","-2","dmg");checkPhase();}
    else if(c.kind==="drone2"){E.hp=Math.max(0,E.hp-3);floatOn("#portrait-enemy","-3","dmg");gainBlock(1);checkPhase();}
    else if(c.kind==="turret"){gainBlock(4);}
    else if(c.kind==="turret2"){gainBlock(6);}
    await sleep(180);
    if(E.hp<=0){await winBattle();return;}
  }
  /* 职业被动 */
  if(G.cls==="medic"){
    const amt=P.hp<P.maxhp*0.3?5:3;
    log("战地急救 +"+amt);
    await healPlayer(amt,false);
  }
  if(G.cls==="mechanic"&&P.hand.length<6){
    P.hand.push({uid:uid++,id:"scrapPart"});
    log("废料回收：获得废料零件");
  }
  /* 玩家中毒 */
  if(P.status.poison){
    P.hp=Math.max(0,P.hp-P.status.poison.dmg);
    floatOn("#portrait-player","-"+P.status.poison.dmg+" 中毒","dmg");
    P.status.poison.turns--;
    if(P.status.poison.turns<=0)P.status.poison=null;
    if(P.hp<=0){await defeat();return;}
    await sleep(200);
  }
  /* 玩家燃烧 */
  if(P.status.burn){
    let d=P.status.burn.dmg;
    if(has("radresist"))d=Math.max(1,Math.floor(d/2));
    P.hp=Math.max(0,P.hp-d);
    floatOn("#portrait-player","-"+d+" 燃烧","dmg");
    if(P.hp<=0){await defeat();return;}
    await sleep(200);
  }
  /* v3 能量：8 起步，每 3 回合 +1，封顶 10；Boss 战 +1 */
  const df=DIFFS[G.diff];
  P.energyCap=Math.max(1,Math.min(10,8+Math.floor((G.turn-1)/3))+(isBoss(G.battleIndex)&&!E.isAmbush?1:0)+(has("veteran")?1:0)-(df.eDown?1:0));
  P.energy=P.energyCap;
  const n=G.turn===1?5+(has("reload")?2:0):8-P.hand.length;
  drawCards(n);
  if(has("lucky")){
    const atks=P.hand.filter(i=>CARDS[i.id].type==="atk");
    if(atks.length){const t=pick(atks);t.tempCost=Math.max(0,effCost(t)-1);}
  }
  render();
  log("你的回合：出牌，或点击「结束回合」");
}
async function endTurn(){
  if(G.busy||G.over||!P||!E)return;
  G.busy=true;
  P.discard.push(...P.hand.map(i=>i.id));P.hand=[];
  P.summonAtkBuff=1;P.summonDisc=0;
  if(has("recycle")&&P.energy>0&&G.rng()<0.5){gainBlock(1);log("能量回收：+1 格挡");}
  P.constructs.forEach(c=>c.turns--);
  P.constructs=P.constructs.filter(c=>c.turns>0);
  decayStatus(P);
  render();
  await sleep(300);
  await enemyTurn();
}
function decayStatus(who){
  ["vuln","weak"].forEach(k=>{if(who.status[k]>0)who.status[k]--;});
  if(who.status.burn){who.status.burn.turns--;if(who.status.burn.turns<=0)who.status.burn=null;}
}
async function enemyTurn(){
  if(G.over)return;
  E.turns++;
  E.block=0;
  /* 不死：丧尸回血 */
  if(E.key==="zombie"){
    const real=Math.min(5,E.maxhp-E.hp);
    if(real>0){E.hp+=real;floatOn("#portrait-enemy","不死 +"+real,"heal");}
  }
  /* 敌方燃烧 */
  if(E.status.burn){
    let d=E.status.burn.dmg;
    if(E.key==="victor")d=Math.max(1,Math.ceil(d/2));
    E.hp=Math.max(0,E.hp-d);
    floatOn("#portrait-enemy","-"+d+" 燃烧","dmg");
    render();
    await sleep(300);
    if(E.hp<=0){await winBattle();return;}
  }
  /* 敌方中毒 */
  if(E.status.poison){
    let d=E.status.poison.dmg;
    if(E.key==="victor")d=Math.max(1,Math.ceil(d/2));
    E.hp=Math.max(0,E.hp-d);
    floatOn("#portrait-enemy","-"+d+" 中毒","dmg");
    E.status.poison.turns--;
    if(E.status.poison.turns<=0)E.status.poison=null;
    render();
    await sleep(280);
    if(E.hp<=0){await winBattle();return;}
  }
  log(E.name+" 的回合");
  const it=E.intent;
  await execIntent(it);
  if(G.over)return;
  if(P.hp<=0){await defeat();return;}
  const df=DIFFS[G.diff];
  if(df.extra&&E.turns>=2&&E.turns%3===2&&it&&!it.charge&&it.acts.length){
    banner("额外行动！");
    await sleep(300);
    await execAct(it.acts[0]);
    if(G.over)return;
    if(P.hp<=0){await defeat();return;}
  }
  decayStatus(E);
  E.intent=planIntent();
  render();
  G.busy=false;
  await playerTurn();
}

/* ================= 出牌 / 合成 ================= */
async function playCard(u){
  if(G.busy||G.over)return;
  const idx=P.hand.findIndex(i=>i.uid===u);
  if(idx<0)return;
  const inst=P.hand[idx],c=CARDS[inst.id],cost=effCost(inst);
  if(cost>P.energy){floatOn("#portrait-player","能量不足","info");return;}
  G.busy=true;
  spendEnergy(cost);
  if(c.sum&&P.summonDisc>0)P.summonDisc--;
  if(c.type==="atk"){G.tf.atkPlayed=true;if(P.costDownNext>0)P.costDownNext--;}
  if(G.cls==="ranger"&&c.type==="atk"&&!G.tf.rangerProc&&E.hp>0){
    G.tf.rangerProc=true;
    E.status.vuln=Math.max(E.status.vuln,1);
    floatOn("#portrait-enemy","猎人标记","info");
  }
  P.hand.splice(idx,1);
  render();
  log("打出「"+c.name+"」");
  await stagePerformance(inst,c);
  if(!G.over&&E&&E.hp<=0){await winBattle();return;}
  G.tf.played++;
  if(isBoss(G.battleIndex)&&E&&!E.isAmbush&&G.tf.played===3&&!G.tf.rew){
    G.tf.rew=true;P.energy++;
    floatOn("#portrait-player","再动！能量 +1","info");
  }
  G.busy=false;
  render();
}
function doFuse(u){
  if(G.busy||G.over)return;
  const idx=P.hand.findIndex(i=>i.uid===u);
  if(idx<0)return;
  const id=P.hand[idx].id;
  const to=FUSIONS[id];
  if(!to)return;
  const other=P.hand.find(i=>i.uid!==u&&i.id===id);
  if(!other)return;
  if(G.cls!=="mechanic"&&G.tf.fused){floatOn("#portrait-player","合成每回合限 1 次","info");return;}
  G.tf.fused=true;
  P.hand=P.hand.filter(i=>i.uid!==u&&i.uid!==other.uid);
  P.hand.push({uid:uid++,id:to});
  vfxOn("#stage",ART.vfxFuse);
  floatOn("#stage","⚗ 合成！「"+CARDS[to].name+"」","info");
  spawnParticles("#stage","#F1C40F",30);
  if(G.cls==="mechanic"&&!G.tf.mechFuseBonus){G.tf.mechFuseBonus=true;drawCards(1);}
  render();
}

/* ================= 战斗装配 ================= */
function startRun(){
  const df=DIFFS[G.diff];
  /* v3 Seed：每局固定随机种子，逻辑随机全可复现 */
  G.runSeed=(Date.now()^(Math.floor(Math.random()*1e9)))>>>0;
  G.rng=mulberry32(G.runSeed);
  /* v3 遥测：闸门量化指标的数据来源（12 号方案 O4） */
  G.stats={turnTotal:0,link:0,weak:0,fuse:0,combats:[],dmgTakenTotal:0};
  P={maxhp:df.php,hp:df.php,block:0,str:0,energy:8,energyCap:8,
     status:{vuln:0,weak:0,burn:null,poison:null,elec:0},buffs:[],constructs:[],summons:[],
     costDownNext:0,pendingWeak:0,summonAtkBuff:1,summonDisc:0,summonCapExtra:0,
     deckList:[...CLASSES[G.cls].deck],deck:[],hand:[],discard:[]};
  G.battleIndex=0;G.totalTurns=0;G.over=false;
  G.eventUsed={};G.runMods={atkDisc:0};G.pendingMain=0;
  G.runEnemies=buildRunEnemies();
  startBattle(0);
}
function setupBattle(def,i,isAmbush){
  const df=DIFFS[G.diff];
  G.battleIndex=i;G.over=false;G.busy=false;
  if(G.stats)G.stats.dmgTakenTotal=0;
  E={key:def.key,name:def.name,img:def.img,weak:def.weak,trait:def.trait,
     maxhp:Math.round(def.hp*df.hpMult*(isAmbush?0.7:1)),block:0,str:0,
     status:{vuln:0,weak:0,burn:null,poison:null,elec:0},turns:0,charging:false,phase:1,intent:null,
     split:false,enraged:false,isAmbush:!!isAmbush};
  E.hp=E.maxhp;
  P.block=0;P.str=has("str1")?1:0;P.status={vuln:0,weak:0,burn:null,poison:null,elec:0};
  P.constructs=[];P.summons=[];P.costDownNext=0;P.pendingWeak=0;
  P.summonAtkBuff=1;P.summonDisc=0;P.summonCapExtra=0;
  P.energyCap=Math.max(1,8+(isBoss(i)&&!isAmbush?1:0)+(has("veteran")?1:0)-(df.eDown?1:0));
  P.energy=P.energyCap;
  P.deck=shuffle([...P.deckList]);P.hand=[];P.discard=[];
  G.turn=0;G.bf={secondwind:false};
  if(has("alloy"))P.block+=8;
  if(has("medkit"))P.hp=Math.min(P.maxhp,P.hp+10);
  $("#battle-bg").style.backgroundImage=`url("${(isBoss(i)&&!isAmbush)?ART.bossBg:ART.battleBg}")`;
  $("#img-player").src=CLASSES[G.cls].img;
  $("#img-enemy").src=E.img;
  $("#player-name").textContent=CLASSES[G.cls].icon+" "+CLASSES[G.cls].name;
  E.intent=planIntent();
  showScreen("battle");
  const actName=["","一","二","三"][CAMPAIGN.actOf(i)];
  banner((isAmbush?"遭遇战 · ":"第"+actName+"幕 · 第 "+(i+1)+"/"+CAMPAIGN.total+" 战"+(isBoss(i)&&!isAmbush?" ☠":"")+" · ")+E.name);
  log("击败 "+E.name+"！");
  render();
  playerTurn();
}
function startBattle(i){
  /* Boss 位：阶段 3 暂用高强度小怪占位（×1.5 HP），阶段 4 换正式 Boss */
  const key=isBoss(i)?BOSS_ORDER[CAMPAIGN.bosses.indexOf(i)]:G.runEnemies[i];
  setupBattle(ENEMY_DEFS[key],i,false);
}
function startAmbush(){setupBattle(ENEMY_DEFS.raider,G.battleIndex,true);}
async function winBattle(){
  if(G.over)return;
  if(G.stats)G.stats.combats.push({battle:G.battleIndex+1,turns:G.turn,won:true,hp:P.hp,maxhp:P.maxhp,dmg:G.stats.dmgTakenTotal});
  G.over=true;G.busy=true;
  banner("敌 人 倒 下");
  log(E.name+" 被击败！");
  render();
  await sleep(900);
  if(E.isAmbush){showAmbushReward();return;}
  if(G.battleIndex<CAMPAIGN.total-1){G.pendingMain=G.battleIndex+1;showDraft();}
  else victory();
}
async function defeat(){
  if(G.over)return;
  if(G.stats)G.stats.combats.push({battle:G.battleIndex+1,turns:G.turn,won:false,hp:0,maxhp:P.maxhp,dmg:G.stats.dmgTakenTotal});
  G.over=true;G.busy=true;
  render();
  await sleep(800);
  $("#defeat-text").textContent="你止步于第 "+(G.battleIndex+1)+" 战："+E.name+"（Seed "+G.runSeed+"）";
  $("#defeat-buffs").innerHTML=P.buffs.length
    ?P.buffs.map(id=>{const b=BUFFS.find(x=>x.id===id);return`<span class="dead">${b.icon} ${b.name}</span>`;}).join("")
    :'<span class="dead">（未获得增益）</span>';
  showOverlay("overlay-defeat");
}
function victory(){
  const hpPct=P.hp/P.maxhp;
  let rank="C";
  if(hpPct>=0.6&&G.totalTurns<=45)rank="S";
  else if(hpPct>=0.4)rank="A";
  else if(hpPct>=0.15)rank="B";
  if(G.diff===G.unlocked&&G.unlocked<2){G.unlocked++;LS.set("wce_unlock",G.unlocked);}
  updateUnlockHint();
  $("#victory-rank").textContent=rank;
  $("#victory-stats").innerHTML=
    `<span>剩余生命 <b>${P.hp}/${P.maxhp}</b></span><span>总回合数 <b>${G.totalTurns}</b></span><span>难度 <b>${DIFFS[G.diff].name}</b></span><span>Seed <b>${G.runSeed}</b></span>`;
  $("#victory-buffs").innerHTML=P.buffs.length
    ?P.buffs.map(id=>{const b=BUFFS.find(x=>x.id===id);return`<span>${b.icon} ${b.name}</span>`;}).join("")
    :'<span style="color:var(--ash)">（未获得增益）</span>';
  showOverlay("overlay-victory");
}

/* ================= 增益三选一 ================= */
let draftSel=null;
function showDraft(){
  draftSel=null;
  const pool=shuffle(BUFFS.filter(b=>!P.buffs.includes(b.id)));
  const opts=pool.slice(0,3);
  if(!opts.some(b=>b.cat==="输出")){
    const atk=pool.find(b=>b.cat==="输出"&&!opts.includes(b));
    if(atk)opts[Math.floor(G.rng()*opts.length)]=atk;
  }
  if(opts.every(b=>b.cat==="输出")){
    const non=pool.find(b=>b.cat!=="输出"&&!opts.includes(b));
    if(non)opts[Math.floor(G.rng()*opts.length)]=non;
  }
  $("#draft-row").innerHTML="";
  opts.forEach(b=>{
    const el=document.createElement("div");
    el.className="draft-card";
    el.innerHTML=`<div class="d-icon">${b.icon}</div><div class="d-name">${b.name}</div><div class="d-desc">${b.desc}</div><div class="d-cat">${b.cat}</div>`;
    el.onclick=()=>{draftSel=b.id;document.querySelectorAll(".draft-card").forEach(x=>x.classList.remove("sel"));el.classList.add("sel");$("#btn-draft-ok").disabled=false;};
    $("#draft-row").appendChild(el);
  });
  $("#btn-draft-ok").disabled=true;
  showOverlay("overlay-draft");
}

/* ================= 随机事件 ================= */
function showEvent(){
  const pool=EVENTS.filter(e=>!G.eventUsed[e.id]);
  if(!pool.length){afterEvent();return;}
  const bag=[...pool],picks=[];
  while(picks.length<Math.min(3,bag.length)){
    const total=bag.reduce((s,e)=>s+e.w,0);
    let r=G.rng()*total,idx=bag.length-1;
    for(let i=0;i<bag.length;i++){r-=bag[i].w;if(r<=0){idx=i;break;}}
    picks.push(bag[idx]);bag.splice(idx,1);
  }
  $("#event-title").textContent="废土奇遇";
  $("#event-sub").textContent=(G.pendingMain===1?"篝火旁的夜晚":"通往终战的路上")+" · 选择一项（不可跳过）";
  const row=$("#event-row");row.innerHTML="";
  picks.forEach(ev=>{
    const el=document.createElement("div");
    el.className="draft-card";
    el.innerHTML=`<div class="d-icon">${ev.icon}</div><div class="d-name">${ev.name}</div><div class="d-desc">${ev.desc}</div><div class="d-cat">奇遇</div>`;
    el.onclick=()=>{G.eventUsed[ev.id]=true;applyEvent(ev);};
    row.appendChild(el);
  });
  showOverlay("overlay-event");
}
function applyEvent(ev){
  hideOverlays();
  if(ev.id==="camp"){
    P.hp=Math.min(P.maxhp,P.hp+18);
    banner("休整一晚 +18 HP");afterEvent();
  }else if(ev.id==="meteor"){
    P.hp=Math.max(1,P.hp-10);
    const pool=BUFFS.filter(b=>!P.buffs.includes(b.id));
    if(pool.length){const b=pick(pool);P.buffs.push(b.id);banner("陨石坠落：获得「"+b.name+"」");}
    else banner("陨石坠落");
    afterEvent();
  }else if(ev.id==="shrine"){
    P.hp=Math.max(1,P.hp-5);G.runMods.atkDisc++;
    banner("辐射神龛：伤害卡费用 -1");afterEvent();
  }else if(ev.id==="dealer"){showDealer();}
  else if(ev.id==="armory"){showArmory();}
  else if(ev.id==="ambush"){banner("掠夺者伏击！");startAmbush();}
}
function afterEvent(){startBattle(G.pendingMain);}
function showDealer(){
  $("#selcard-title").textContent="🎴 废土商人";
  $("#selcard-sub").textContent="选择 1 张卡永久移除（点击卡牌）";
  $("#selcard-chips").innerHTML="";
  const grid=$("#selcard-grid");grid.innerHTML="";
  P.deckList.forEach((id,i)=>{
    const el=cardEl({uid:0,id},false);
    el.onclick=()=>{P.deckList.splice(i,1);hideOverlays();banner("移除了「"+CARDS[id].name+"」");afterEvent();};
    grid.appendChild(el);
  });
  showOverlay("overlay-selectcard");
}
function showArmory(){
  const pool=Object.entries(CARDS).filter(([id,c])=>!c.fused&&!c.temp&&(c.cls==="u"||c.cls===G.cls));
  const opts=shuffle(pool).slice(0,3);
  showCardPick("🔫 旧世界军械库","选择 1 张卡加入卡组",opts,(id)=>{
    P.deckList.push(id);banner("获得「"+CARDS[id].name+"」");afterEvent();
  });
}
function showAmbushReward(){
  const pool=Object.entries(CARDS).filter(([id,c])=>!c.fused&&!c.temp&&c.rar!=="n"&&(c.cls==="u"||c.cls===G.cls));
  const opts=shuffle(pool).slice(0,3);
  showCardPick("💥 战利品","伏击胜利！选择 1 张稀有卡加入卡组",opts,(id)=>{
    P.deckList.push(id);banner("获得「"+CARDS[id].name+"」");startBattle(G.pendingMain);
  });
}
function showCardPick(title,sub,opts,onPick){
  $("#selcard-title").textContent=title;
  $("#selcard-sub").textContent=sub;
  $("#selcard-chips").innerHTML="";
  const grid=$("#selcard-grid");grid.innerHTML="";

/* ================= 渲染 ================= */
function statusChips(s,str,constructs,summons){
  let h="";
  if(str>0)h+=`<span class="st str">💪力量 ${str}</span>`;
  if(s.vuln>0)h+=`<span class="st vuln">易伤 ${s.vuln}</span>`;
  if(s.weak>0)h+=`<span class="st weak">虚弱 ${s.weak}</span>`;
  if(s.elec>0)h+=`<span class="st elec">⚡感电 ${s.elec}</span>`;
  if(s.burn)h+=`<span class="st burn">🔥燃烧 ${s.burn.turns}</span>`;
  if(s.poison)h+=`<span class="st poison">☠中毒 ${s.poison.turns}</span>`;
  (constructs||[]).forEach(c=>{
    h+=`<span class="st con">${c.kind==="drone"?"🛰无人机":c.kind==="drone2"?"🛰武装无人机":c.kind==="turret"?"🗼炮塔":"🗼重炮塔"} ${c.turns}</span>`;
  });
  (summons||[]).forEach(sm=>{h+=`<span class="st sum">${sm.icon}${sm.name} ${sm.hp}HP</span>`;});
  return h;
}
function intentChips(it){
  if(!it)return"";
  if(it.charge)return`<span class="intent-chip chg">❓ 蓄力中…</span>`;
  return it.acts.map(a=>{
    if(a.k==="atk")return`<span class="intent-chip atk">🗡 攻击 ${previewEnemyDmg(a.v)}</span>`;
    if(a.k==="atkSummon")return`<span class="intent-chip sum">🐺 袭击召唤物 ${a.v}</span>`;
    if(a.k==="block")return`<span class="intent-chip def">🛡 格挡 ${a.v}</span>`;
    if(a.k==="heal")return`<span class="intent-chip buf">✚ 治疗 ${a.v}</span>`;
    if(a.k==="str")return`<span class="intent-chip buf">✚ 力量+${a.v}</span>`;
    if(a.k==="burn")return`<span class="intent-chip atk">🔥 燃烧</span>`;
    if(a.k==="poison")return`<span class="intent-chip atk">☠ 中毒</span>`;
    if(a.k==="web")return`<span class="intent-chip atk">🕸 虚弱</span>`;
    if(a.k==="disarm")return`<span class="intent-chip atk">⚔ 缴械</span>`;
    if(a.k==="steal")return`<span class="intent-chip sum">✋ 掠夺</span>`;
    return"";
  }).join("");
}
function previewEnemyDmg(v){
  let d=v+E.str;
  if(E.status.weak>0)d=Math.floor(d*0.75);
  if(P.status.vuln>0)d=Math.floor(d*1.5);
  return Math.max(0,d);
}
const TAG_LABEL={phys:"物理",fire:"火焰",elec:"电击",poison:"毒素"};
function render(){
  if(!P||!E)return;
  $("#tb-turn").textContent=G.turn;
  $("#tb-battle").textContent=G.battleIndex+1;
  $("#diff-chip").textContent=DIFFS[G.diff].icon+" "+DIFFS[G.diff].name;
  $("#buff-bar").innerHTML=P.buffs.map(id=>{
    const b=BUFFS.find(x=>x.id===id);return`<span title="${b.name}：${b.desc}">${b.icon}</span>`;
  }).join("");
  $("#enemy-name").innerHTML=E.name+(E.key==="victor"
    ?`<span class="phase-tag">第${["一","二","三"][E.phase-1]}阶段</span>`:"");
  $("#enemy-tags").innerHTML=
    `<span class="weak-chip ${E.weak}">弱点·${TAG_LABEL[E.weak]}</span>`+
    `<span class="trait-chip" title="${E.trait.desc}">特性·${E.trait.name}</span>`;
  setBar("#enemy-hp-fill","#enemy-hp-txt",E.hp,E.maxhp);
  const eb=$("#enemy-blk");
  eb.classList.toggle("on",E.block>0);eb.textContent="🛡"+E.block;
  $("#intent-row").innerHTML=intentChips(E.intent);
  $("#enemy-status").innerHTML=statusChips(E.status,E.str,null,null);
  const pe=$("#portrait-enemy");
  pe.classList.toggle("burning",!!E.status.burn);
  pe.classList.toggle("poisoned",!!E.status.poison);
  setBar("#player-hp-fill","#player-hp-txt",P.hp,P.maxhp);
  const pb=$("#player-blk");
  pb.classList.toggle("on",P.block>0);pb.textContent="🛡"+P.block;
  $("#player-status").innerHTML=statusChips(P.status,P.str,P.constructs,P.summons);
  const pp=$("#portrait-player");
  pp.classList.toggle("burning",!!P.status.burn);
  pp.classList.toggle("poisoned",!!P.status.poison);
  let pips="";
  for(let i=0;i<P.energyCap;i++)pips+=`<div class="pip ${i<P.energy?"on":""}"></div>`;
  $("#energy-pips").innerHTML=pips;
  $("#energy-label").textContent=`能量 ${P.energy}/${P.energyCap}`;
  $("#deck-count").textContent=P.deck.length;
  $("#discard-count").textContent=P.discard.length;
  const hand=$("#hand-row");
  hand.innerHTML="";
  const counts={};
  P.hand.forEach(i=>counts[i.id]=(counts[i.id]||0)+1);
  P.hand.forEach(inst=>{
    const el=cardEl(inst,false);
    const c=CARDS[inst.id];
    if(counts[inst.id]>=2&&FUSIONS[inst.id]&&!c.fused){
      el.classList.add("fuseable");
      const fb=document.createElement("button");
      fb.className="fuse-btn";fb.textContent="⚗ 合成";
      fb.onclick=(ev)=>{ev.stopPropagation();doFuse(inst.uid);};
      el.appendChild(fb);
    }
    if(effCost(inst)>P.energy||G.busy)el.classList.add("cant");
    el.onclick=()=>playCard(inst.uid);
    hand.appendChild(el);
  });
}
function setBar(fillSel,txtSel,hp,max){
  const f=$(fillSel);
  f.style.width=(hp/max*100)+"%";
  f.classList.toggle("low",hp/max<0.25);
  $(txtSel).textContent=hp+" / "+max;
}

function buildCodex(){
  let h=`<h3>角色立绘</h3><div class="codex-chars">`;
  [["废土游侠",ART.ranger],["机械师",ART.mechanic],["战地医师",ART.medic],["召唤师",ART.summoner],
   ["碎颅者·洛克",ART.lock],["腐烂丧尸群",ART.zombie],["变异蛛后",ART.spider],["掠夺者双刀客",ART.raider],
   ["腐沼之母",ART.mire],["钢铁暴君·维克托",ART.victor]]
   .forEach(([n,src])=>{h+=`<figure><img src="${src}"><figcaption>${n}</figcaption></figure>`;});
  h+=`</div>`;
  h+=`<h3>元素联动规则（打出带标签的卡触发）</h3><table><tr><th>规则</th><th>触发</th><th>效果</th></tr>
    <tr><td>R1 爆燃</td><td>物理卡命中燃烧敌人</td><td>×2 并立即结算剩余燃烧</td></tr>
    <tr><td>R2 过载</td><td>电卡命中燃烧敌人</td><td>×1.5，燃烧转为感电</td></tr>
    <tr><td>R3 电弧助燃</td><td>火卡命中感电敌人</td><td>×1.5</td></tr>
    <tr><td>R4 毒雾爆</td><td>火卡命中中毒敌人</td><td>+5 伤害</td></tr>
    <tr><td>R5 烈性反应</td><td>毒素注射命中燃烧敌人</td><td>燃烧每回合伤害 +2</td></tr>
    <tr><td>— 弱点克制</td><td>标签=敌人弱点</td><td>×1.5（与联动可叠乘，总倍率封顶 3）</td></tr></table>`;
  h+=`<h3>敌人弱点与特性</h3><table><tr><th>敌人</th><th>HP</th><th>弱点</th><th>特性</th></tr>`;
  Object.values(ENEMY_DEFS).forEach(e=>{
    h+=`<tr><td>${e.name}</td><td>${e.hp}</td><td><span class="weak-chip ${e.weak}">${TAG_LABEL[e.weak]}</span></td><td>${e.trait.name}：${e.trait.desc}</td></tr>`;
  });
  h+=`</table>`;
  h+=`<h3>合成表（手牌两张同名卡 → ⚗ 合成）</h3><table><tr><th>原料</th><th>产物</th></tr>`;
  Object.entries(FUSIONS).forEach(([from,to])=>{
    h+=`<tr><td>${CARDS[from].name} ×2</td><td>★ ${CARDS[to].name}（${CARDS[to].text}）</td></tr>`;
  });
  h+=`</table>`;
  const clsName={u:"通用卡池",ranger:"游侠专属",mechanic:"机械师专属",medic:"战地医师专属",summoner:"召唤师专属"};
  for(const k of["u","ranger","mechanic","medic","summoner"]){
    h+=`<h3>${clsName[k]}</h3><div class="codex-grid">`;
    Object.entries(CARDS).filter(([,c])=>c.cls===k).forEach(([id,c])=>{
      h+=`<div class="card ${c.type}${c.fused?" fused":""}" style="cursor:default">
        <div class="c-cost">${c.cost}</div>${c.fused?'<div class="fuse-tag">升阶</div>':""}<div class="c-rar ${c.rar}"></div>
        <img class="c-art" src="${c.img}">
        <div class="c-name">${c.name}</div><div class="c-type">${TYPE_LABEL[c.type]}${c.tag?"·"+TAG_LABEL[c.tag]:""}</div>
        <div class="c-text">${c.text}</div></div>`;
    });
    h+=`</div>`;
  }
  $("#codex-body").innerHTML=h;
}

/* ================= 设置 ================= */
function applyOptsUI(){
  $("#opt-fast").textContent=G.opts.fast?"开":"关";
  $("#opt-nums").textContent=G.opts.nums?"开":"关";
}
function saveOpts(){LS.set("wce_opts",JSON.stringify(G.opts));}

/* ================= 事件绑定（先绑全部，再做 DOM 操作） ================= */
$("#btn-menu-start").onclick=()=>{buildMenu();showScreen("setup");};
$("#setup-back").onclick=()=>showScreen("menu");
$("#btn-menu-codex").onclick=()=>{buildCodex();showOverlay("overlay-codex");};
$("#btn-menu-settings").onclick=()=>{applyOptsUI();showOverlay("overlay-settings");};
$("#btn-codex-battle").onclick=()=>{buildCodex();showOverlay("overlay-codex");};
$("#btn-codex-close").onclick=hideOverlays;
$("#btn-settings-close").onclick=hideOverlays;
$("#btn-start").onclick=()=>{
  if(G.selDiff==null||!G.selClass)return;
  G.diff=G.selDiff;G.cls=G.selClass;
  startRun();
};
$("#btn-end").onclick=endTurn;
$("#btn-quit").onclick=toMenu;
$("#btn-again").onclick=()=>{hideOverlays();startRun();};
$("#btn-retry").onclick=()=>{hideOverlays();startRun();};
$("#btn-tomenu-v").onclick=toMenu;
$("#btn-tomenu-d").onclick=toMenu;
$("#btn-draft-ok").onclick=()=>{
  if(!draftSel)return;
  P.buffs.push(draftSel);
  const b=BUFFS.find(x=>x.id===draftSel);
  hideOverlays();
  banner("获得增益 · "+b.name);
  showEvent();
};
$("#opt-fast").onclick=()=>{G.opts.fast=!G.opts.fast;saveOpts();applyOptsUI();};
$("#opt-nums").onclick=()=>{G.opts.nums=!G.opts.nums;saveOpts();applyOptsUI();};
let resetArmed=false;
$("#opt-reset").onclick=(e)=>{
  if(!resetArmed){
    resetArmed=true;e.target.textContent="确认重置？";
    setTimeout(()=>{resetArmed=false;e.target.textContent="重置";},2500);
    return;
  }
  G.unlocked=0;LS.del("wce_unlock");resetArmed=false;
  e.target.textContent="已重置";updateUnlockHint();
  setTimeout(()=>{e.target.textContent="重置";},1500);
};

/* ================= 启动 ================= */
$("#menu-bg").style.backgroundImage=`url("${ART.keyArt}")`;
$("#setup-bg").style.backgroundImage=`url("${ART.menuBg}")`;
$("#draft-bg").style.backgroundImage=`url("${ART.draftBg}")`;
$("#victory-bg").style.backgroundImage=`url("${ART.victoryBg}")`;
applyOptsUI();
updateUnlockHint();
showScreen("menu");
</script>
</body>
</html>
